[package]
name = "corpora-ui"
description = "Corpora UI for GPUI: foundations, atoms, composed components and blocks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["glass"]
# Paints `atoms::glass` with the renderer's backdrop pass. It needs the patched
# GPUI in `gpui/vendor`: an application outside this workspace must carry the
# same `[patch.crates-io]` entries, or turn this off to get a translucent fill.
glass = []

[dependencies]
emojis = "0.9.1"
gpui-kit.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
