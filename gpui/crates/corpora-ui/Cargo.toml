[package]
name = "corpora-ui"
description = "Corpora UI for GPUI: foundations, atoms, composed components and blocks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["glass"]
# Paints `atoms::glass` with the renderer's backdrop pass. It needs the patched
# GPUI in `gpui/vendor`: an application outside this workspace must carry the
# same `[patch.crates-io]` entries, or turn this off to get a translucent fill.
glass = []
# gpui-kit 0.10 does not forward this vendored GPUI feature yet.
hot-reload = ["dep:gpui-hot-reload"]

[dependencies]
emojis = "0.9.1"
gpui-kit.workspace = true
gpui-hot-reload = { package = "gpui-pre", version = "=0.3.12", default-features = false, features = ["hot-reload"], optional = true }
# Read `foundations/palette.toml` and `foundations/theme.toml`.
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
