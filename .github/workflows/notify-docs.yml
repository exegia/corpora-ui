# Pings exegia/corpora-docs when docs/ changes on main so the mirror re-runs.
# Reference: https://github.com/exegia/corpora-auth/blob/main/.github/workflows/notify-docs.yml
name: Notify docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

jobs:
  dispatch:
    name: Trigger docs mirror
    runs-on: ubuntu-latest
    steps:
      - name: Check the dispatch token is configured
        id: token
        env:
          GH_TOKEN: ${{ secrets.CORPORA_DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::CORPORA_DOCS_DISPATCH_TOKEN is not set — skipping. The docs site will pick this change up on its nightly mirror instead."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch to corpora-docs
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.CORPORA_DOCS_DISPATCH_TOKEN }}
        run: |
          gh api repos/exegia/corpora-docs/dispatches \
            -f event_type=docs-updated \
            -F client_payload[repo]="${{ github.repository }}" \
            -F client_payload[sha]="${{ github.sha }}"
