# CI — pull request checks for the `feature/** → dev → next` lifecycle.
#
# This is where the test surface lives. `main` deliberately runs none of it: everything a PR
# into `main` would test has already run on `next`, so re-running it there is redundant.
#
# Any build here exists only to prove the package compiles. Publishing happens exclusively
# from a release tag on `main` (`publish.yml`).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, next]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify required repository files
        run: |
          set -euo pipefail
          test -f README.md
          test -f .github/BRANCH-AND-RELEASE-POLICY.md
          test -f .github/LIFECYCLE.md

      - name: Detect package
        id: pkg
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet — skipping install, lint, test, and build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install dependencies
        if: steps.pkg.outputs.present == 'true'
        run: bun install --frozen-lockfile

      # Each of these runs only when the package actually defines the script, so the pipeline
      # stays green while the library is still taking shape.
      - name: Lint
        if: steps.pkg.outputs.present == 'true'
        run: bun run --if-present lint

      - name: Typecheck
        if: steps.pkg.outputs.present == 'true'
        run: bun run --if-present typecheck

      - name: Unit tests
        if: steps.pkg.outputs.present == 'true'
        run: bun run --if-present test

      - name: Build (verification only — never published from CI)
        if: steps.pkg.outputs.present == 'true'
        run: bun run --if-present build
