# Promotion — opens the release PR from `next` into `main`.
#
# `next` descends from `main`, so the release *is* the commits already sitting on `next`.
# Nothing is copied: no cherry-pick, no `release/*` branch, no patch-id matching, and no
# re-anchoring of the tag afterwards. Merging the PR carries those commits onto `main` with
# their SHAs intact, and `release-tag.yml` publishes from there.
#
# Run manually when staging is ready to ship. The PR is opened for review, never auto-merged.
name: Promote to Main

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to promote (defaults to the open tag on next)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-to-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout next
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: next

      - name: Fetch all branches and tags
        run: |
          set -euo pipefail
          git fetch --force origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          . .github/scripts/release-version.sh
          configure_git_bot

          # The invariant the whole model rests on. If it does not hold, the promotion
          # cannot fast-forward and every "has this shipped?" answer below is unreliable —
          # so fail loudly here rather than produce a subtly wrong release.
          if ! git merge-base --is-ancestor origin/main origin/next; then
            {
              echo "### Promotion blocked"
              echo ""
              echo '`main` is not an ancestor of `next`, so the release cannot fast-forward.'
              echo ""
              echo "Someone pushed to \`main\` directly, or a PR into a long-lived branch was"
              echo "squashed instead of merged. Re-establish the ancestry with"
              echo '`.github/scripts/reconcile-ancestry.sh`, then re-run this workflow.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "main is not an ancestor of next — refusing to promote." >&2
            exit 1
          fi

          tag="${INPUT_TAG:-$(open_release_tag)}"
          if [ -z "$tag" ]; then
            echo "No open release tag on next — nothing to promote." >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag does not exist." >&2
            exit 1
          fi

          count=$(git rev-list --count --no-merges "origin/main..origin/next")
          if [ "$count" -eq 0 ]; then
            echo "$tag adds no commits on top of main — nothing to promote." >&2
            exit 1
          fi

          # Stamp the changelog on `next` rather than on a promotion branch: the release is
          # next's own history now, so the stamp has to be part of it. main still never takes
          # a direct push — it only ever receives this commit through the PR merge.
          today=$(date -u +%Y-%m-%d)
          if [ -f CHANGELOG.md ] && grep -qE '^##[[:space:]]*\[Unreleased\]' CHANGELOG.md; then
            sed -i -E "0,/^##[[:space:]]*\[Unreleased\]/s|^##[[:space:]]*\[Unreleased\].*|## [${tag}] - ${today}|" CHANGELOG.md
            git add CHANGELOG.md
            git commit -m "docs(changelog): stamp ${tag} (${today})"
            git push origin HEAD:next

            # The tag is still provisional at this point — nothing has been released under
            # it — so moving it onto the stamp keeps it on what main will actually contain.
            git tag -f -a "$tag" -m "Release $tag (staging, stamped ${today})" HEAD
            git push --force origin "refs/tags/$tag"
          fi

          release_sha=$(git rev-parse HEAD)

          body=$(printf '%s\n' \
            "Promotes \`next\` into \`main\` as **$tag**." \
            "" \
            "$count commit(s) ahead of \`main\`. \`next\` descends from \`main\`, so nothing is" \
            "copied: the commits keep their SHAs and \`$tag\` already points at" \
            "\`${release_sha:0:7}\`, which this carries onto \`main\` intact." \
            "" \
            "**Approve — do not use the merge button.** \`promotion-merge.yml\` fast-forwards" \
            "\`main\` onto this commit once the PR is approved and green, so \`main\` becomes the" \
            "tagged commit itself rather than a merge commit above it. The button cannot" \
            "fast-forward, and a squash would sever \`main\` from \`next\` entirely." \
            "" \
            "Then \`release-tag.yml\` publishes the GitHub Release for \`$tag\` and hands off" \
            "to \`publish.yml\`.")

          existing=$(gh pr list --repo "$REPOSITORY" --base main --head next \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "${existing:-}" ]; then
            gh pr edit "$existing" --title "release: $tag" --body "$body"
            url=$(gh pr view "$existing" --repo "$REPOSITORY" --json url --jq .url)
            echo "Updated existing release PR #$existing"
          else
            url=$(gh pr create --repo "$REPOSITORY" \
              --base main --head next \
              --title "release: $tag" --body "$body" --label release)
          fi

          {
            echo "### Release PR ready"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$tag\` |"
            echo "| Commits ahead of main | $count |"
            echo "| Copied commits | none |"
            echo "| PR | $url |"
          } >> "$GITHUB_STEP_SUMMARY"
