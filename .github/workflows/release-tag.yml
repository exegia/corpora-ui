# Release — publishes the GitHub Release for the tag now sitting on `main`.
#
# Under the linear model the tag needs no re-anchoring: the promotion carries `next`'s commits
# onto `main` with their SHAs intact, so the tag cut on `next` is already correct and already an
# ancestor of `main`. This workflow only turns it into a GitHub Release and hands off to
# `publish.yml`.
#
# It triggers on the push to `main` rather than on the PR merge, so a fast-forward — which
# produces no merge commit at all — is caught just as reliably as a merge commit.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # create the release
  actions: write         # dispatch publish.yml

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch all branches and tags
        run: |
          set -euo pipefail
          git fetch --force origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Highest vX.Y.Z that has landed on main. Deliberately an ancestry test rather than
          # `--points-at HEAD`: GitHub's merge button cannot perform a true fast-forward, so a
          # promotion normally leaves main on a merge commit whose *second parent* carries the
          # tag. Ancestry is the property that holds under both shapes.
          tag=""
          for t in $(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V); do
            if git merge-base --is-ancestor "$t" HEAD 2>/dev/null; then
              tag="$t"
            fi
          done
          if [ -z "$tag" ]; then
            echo "No vX.Y.Z tag has landed on main — nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          tag_sha=$(git rev-parse "${tag}^{commit}")
          gh release create "$tag" --repo "$REPOSITORY" \
            --target main \
            --title "$tag" \
            --notes "Release ${tag}, tagged at \`${tag_sha:0:7}\` and merged into \`main\`." \
            --generate-notes

          # A release created with GITHUB_TOKEN does not emit `release: published`, so
          # publish.yml would never fire on its own. Dispatch it explicitly instead of
          # leaving a maintainer to notice and run it by hand.
          gh workflow run publish.yml --repo "$REPOSITORY" --ref main -f tag="$tag"

          {
            echo "### Released $tag"
            echo ""
            echo "Tagged at \`${tag_sha:0:7}\`, now on \`main\`; publish dispatched."
          } >> "$GITHUB_STEP_SUMMARY"
