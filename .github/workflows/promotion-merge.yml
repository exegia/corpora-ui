# Promotion merges — performs the `dev → next` and `next → main` merges with git, on approval.
#
# WHY THIS IS NOT THE MERGE BUTTON
#
# The linear release model requires that `main` stays an ancestor of `next`, and `next` an
# ancestor of nothing that squashes it. GitHub has no per-PR merge-method setting: whichever
# button a reviewer happens to click decides the strategy, and one squash severs the ancestry
# that `release-version.sh`, `promote-to-main.yml` and `release-tag.yml` all depend on. That is
# exactly how the repository ended up with `git merge-base main next` == the Initial commit.
#
# So the strategy is not left to a button. Approval is the trigger; git does the merge:
#
#   dev  → next   merge commit (--no-ff)  — next carries history dev does not, so this is a
#                                           real merge, and the merge commit records the promotion
#   next → main   fast-forward (--ff-only) — main lands on the exact tagged commit, which the
#                                           merge button cannot do at all
#
# The second is strictly better than anything the UI offers: `main` becomes the tagged commit
# rather than a merge commit above it.
#
# Review is still the gate. This only ever runs on an approved PR whose checks are green.
name: Promotion Merge

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: "Promotion PR number to merge"
        required: true
        type: string

permissions:
  contents: write        # push the merge to next / main
  pull-requests: write   # comment on the PR

# Serialize: dev → next and next → main must never interleave.
concurrency:
  group: promotion-merge
  cancel-in-progress: false

jobs:
  merge:
    # Cheap pre-filter so an ordinary code review on a feature PR does not spin up a runner.
    # The authoritative validation is in the "Validate the promotion" step below, which also
    # covers the workflow_dispatch path where no review payload exists.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.review.state == 'approved' &&
       ((github.event.pull_request.base.ref == 'next' && github.event.pull_request.head.ref == 'dev') ||
        (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'next')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches and tags
        run: |
          set -euo pipefail
          git fetch --force origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

      - name: Validate the promotion
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail

          read -r base head state decision < <(
            gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
              --json baseRefName,headRefName,state,reviewDecision \
              --jq '[.baseRefName, .headRefName, .state, (.reviewDecision // "NONE")] | @tsv'
          )
          echo "PR #$PR_NUMBER: $head → $base ($state, review: $decision)"

          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is $state — nothing to merge." >&2
            exit 1
          fi

          case "$head → $base" in
            "dev → next"|"next → main") ;;
            *)
              echo "PR #$PR_NUMBER is $head → $base, not a promotion PR — refusing." >&2
              exit 1
              ;;
          esac

          # Re-checked here rather than trusting the event: a workflow_dispatch carries no
          # review payload at all, and an approval can be dismissed between event and run.
          if [ "$decision" != "APPROVED" ]; then
            echo "PR #$PR_NUMBER is not approved (reviewDecision: $decision) — refusing." >&2
            exit 1
          fi

          # A promotion must not outrun its own CI. `gh pr checks` exits non-zero while any
          # check is failing or still running, which is the behaviour we want.
          if ! gh pr checks "$PR_NUMBER" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::Checks are not green on PR #$PR_NUMBER."
            gh pr checks "$PR_NUMBER" --repo "$REPOSITORY" || true
            echo "Refusing to merge PR #$PR_NUMBER with non-green checks." >&2
            exit 1
          fi

          {
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"

      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          BASE: ${{ steps.check.outputs.base }}
          HEAD: ${{ steps.check.outputs.head }}
        run: |
          set -euo pipefail
          . .github/scripts/release-version.sh
          configure_git_bot

          git checkout -B "$BASE" "origin/$BASE"

          if [ "$BASE" = "main" ]; then
            # Fast-forward only. If this fails, `next` does not descend from `main` and the
            # release would silently become a merge commit above the tag instead of the tagged
            # commit itself — stop rather than paper over it.
            if ! git merge --ff-only "origin/$HEAD"; then
              msg=$(printf '%s\n' \
                "🚫 **Promotion merge refused**" \
                "" \
                "\`main\` cannot fast-forward onto \`next\`, which means the two branches have" \
                "diverged. Merging now would put \`main\` on a commit that is not the one carrying" \
                "the release tag." \
                "" \
                "Repair the ancestry with \`.github/scripts/reconcile-ancestry.sh\`, then approve" \
                "again. See \`.github/BRANCH-AND-RELEASE-POLICY.md\`.")
              gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "$msg"
              echo "main cannot fast-forward onto next — refusing." >&2
              exit 1
            fi
            echo "Fast-forwarded main onto $(git rev-parse --short HEAD)"
          else
            # Always a merge commit: `next` carries history `dev` does not (the ancestry bridge,
            # and every prior promotion), so a fast-forward is impossible and a squash is the
            # thing this workflow exists to prevent.
            if ! git merge --no-ff "origin/$HEAD" -m "chore: promote $HEAD into $BASE (#$PR_NUMBER)"; then
              git merge --abort || true
              msg=$(printf '%s\n' \
                "🚫 **Promotion merge refused**" \
                "" \
                "\`$HEAD\` does not merge cleanly into \`$BASE\`. Resolve the conflict on \`$HEAD\`" \
                "and approve again.")
              gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "$msg"
              echo "Conflict merging $HEAD into $BASE — refusing." >&2
              exit 1
            fi
            echo "Merged $HEAD into $BASE as $(git rev-parse --short HEAD)"
          fi

          git push origin "HEAD:$BASE"

          # Pushing the head's commits into the base makes GitHub mark the PR merged on its
          # own. Comment for the audit trail, and close explicitly if it somehow stayed open.
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body \
            "✅ Merged \`$HEAD\` → \`$BASE\` at \`$(git rev-parse --short HEAD)\` by **Promotion Merge**, so the strategy is guaranteed rather than left to the merge button."

          if [ "$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state --jq .state)" = "OPEN" ]; then
            gh pr close "$PR_NUMBER" --repo "$REPOSITORY" \
              --comment "Commits are on \`$BASE\`; closing."
          fi

          {
            echo "### Promoted $HEAD → $BASE"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Strategy | $([ "$BASE" = "main" ] && echo 'fast-forward' || echo 'merge commit') |"
            echo "| Result | \`$(git rev-parse --short HEAD)\` |"
            echo "| PR | #$PR_NUMBER |"
          } >> "$GITHUB_STEP_SUMMARY"
