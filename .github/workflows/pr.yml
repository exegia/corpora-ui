# Everything that runs *before* a merge.
#
#   <type>/<slug>  ->  <type>/<slug>     guard + check               (stacked)
#   <type>/<slug>  ->  release/vX.Y.Z    guard + check + AI review
#   release/vX.Y.Z ->  main              guard + check + packaged tarball
#
# Draft PRs only get the guard. The full suite starts at `ready_for_review`
# and re-runs on every push after that.
#
# `edited` is in the trigger list because a PR's base can change after the
# checks have already run — GitHub silently retargets an open PR onto the
# trunk when its base branch is deleted, which is routine when a stack merges
# and leaves a PR behind. Without `edited`, the verdicts computed against the
# old base stay pinned to the PR forever: re-running the job replays the
# original event payload, so it recomputes the same stale answer. The guard is
# cheap and its inputs (base, title) are exactly what an edit changes, so it
# re-runs on every edit; the expensive jobs re-run only when the base itself
# moved (see `github.event.changes.base` below), not on a title or body tweak.
#
# The `branches` filter matches on `github.base_ref`, which reports a stacked
# PR's *ultimate* base rather than its immediate parent — so stacked feature
# PRs pass this filter via `main` and do not need their own entry here. The
# jobs below read the true parent from the event payload instead.
name: PR

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited]
    branches:
      - main
      - "release/v*"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # The guard resolves whether a stacked PR's base is itself an open PR.
  pull-requests: read

env:
  INSTALL_FLAGS: --frozen-lockfile

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Passed as environment, never interpolated into the shell: a PR title is
      # attacker-controlled text.
      #
      # `event.pull_request.base.ref`, NOT `github.base_ref`: when a PR is part
      # of a GitHub stack, `github.base_ref` reports the stack's ultimate base
      # rather than the PR's own parent. This repo's model is inherently a
      # stack (<type>/<slug> -> release/vX.Y.Z -> main), so on every stacked
      # feature PR `github.base_ref` reads 'main' and the guard rejects it for
      # not being a release branch. The payload's PR object is authoritative.
      # A <type>/<slug> base is a link in a stack exactly when that branch
      # carries a PR of its own. Without this, any well-formed branch name
      # passes as a base — including a stale branch left behind by a merged
      # stack, whose PR would then never reach a release branch.
      #
      # `--state all`, not `--state open`: a partial stack merge leaves the PRs
      # above it based on a branch that has already landed, which is a real
      # state to be in until `gh stack sync` retargets them. The guard warns
      # there rather than failing; see the Makefile for the full rule.
      #
      # Resolved here rather than inside the Makefile so `make pr-guard` needs
      # no token and stays runnable locally.
      - name: Resolve the base branch's own PR
        id: base_pr
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BASE" \
            --state all --limit 1 --json number,state)
          {
            echo "number=$(jq -r '.[0].number // ""' <<<"$pr")"
            echo "state=$(jq -r '.[0].state // ""' <<<"$pr")"
          } >> "$GITHUB_OUTPUT"

      - name: Check base, branch name and title
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE_PR: ${{ steps.base_pr.outputs.number }}
          BASE_PR_STATE: ${{ steps.base_pr.outputs.state }}
        run: make pr-guard

  check:
    name: check
    # On `edited`, only a base change can alter this job's verdict — skip the
    # title and body edits that also raise that event.
    if: ${{ !github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base.ref.from != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: make ci

  package:
    name: package
    # See the guard job for why this is not `github.base_ref`.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.base.ref == 'main' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '') }}
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: make pack
      - uses: actions/upload-artifact@v4
        with:
          name: corpora-ui-tarball
          path: dist-pack/*.tgz
          if-no-files-found: error

  review:
    name: review
    # See the guard job for why this is not `github.base_ref`.
    if: ${{ !github.event.pull_request.draft && startsWith(github.event.pull_request.base.ref, 'release/') && (github.event.action != 'edited' || github.event.changes.base.ref.from != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # the review is posted through the issue-comments API
      actions: write # lets the review read this PR's CI results
      id-token: write
    env:
      # The `secrets` context cannot be referenced from an `if:` — GitHub rejects
      # the whole file with "Unrecognized named-value: 'secrets'". Mapping it to a
      # job-level env var makes it reachable from a step-level `if:`. Only
      # emptiness is ever tested; the value is never printed.
      CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # A permanently-red check that means "unconfigured" is worse than no
      # check — it trains everyone to merge past red. Skip loudly instead.
      - name: Note that review is unconfigured
        if: ${{ env.CLAUDE_TOKEN == '' }}
        run: |
          {
            echo "### Review skipped"
            echo
            echo "\`CLAUDE_CODE_OAUTH_TOKEN\` is not set on this repository."
            echo "Add it under **Settings → Secrets and variables → Actions**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Light AI review
        if: ${{ env.CLAUDE_TOKEN != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          allowed_bots: "*"
