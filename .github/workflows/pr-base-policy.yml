# Base-branch policy enforcement for the long-lived branches.
#
# - lifecycle branches target `dev`
# - only `dev` may target `next`
# - only a `release/vX.Y.Z` promotion branch may target `main`
#
# Note the difference from the shared template: promotion into `main` happens by cherry-pick
# onto a `release/*` branch, not by merging `next` directly, so a `next → main` PR is refused.
#
# Deterministic branch math, so this remains a plain workflow.
name: PR Base-Branch Policy

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write   # comment, reassign base, close
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce base-branch policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          is_lifecycle_head() {
            case "$1" in
              feature/*|bug/*|doc/*|chore/*|hotfix/*|dependabot/*|copilot/*|claude/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Only a promotion branch may release into main.
          if [ "$BASE_REF" = "main" ]; then
            case "$HEAD_REF" in
              release/v[0-9]*.[0-9]*.[0-9]*)
                echo "$HEAD_REF → main promotion PR — allowed."
                exit 0
                ;;
            esac
            close_comment=$(printf '%s\n' \
              "🚫 **Closed by base-branch policy**" \
              "" \
              "PRs into \`main\` may only come from a \`release/vX.Y.Z\` promotion branch. This PR" \
              "targets \`main\` from \`$HEAD_REF\`, which is not allowed — including \`next\` itself:" \
              "releases are cherry-picked onto \`main\`, not merged from staging." \
              "" \
              "To ship this change:" \
              "1. Merge your work into \`dev\` (every PR targets \`dev\`)." \
              "2. Let the \`dev-to-next\` workflow open a \`dev → next\` PR. On merge, \`next-staging.yml\`" \
              "   cuts or advances the open \`vX.Y.Z\` tag." \
              "3. Run the **Promote to Main** workflow to cherry-pick that release and open the PR." \
              "" \
              "See \`.github/BRANCH-AND-RELEASE-POLICY.md\`.")
            gh pr comment "$PR_NUMBER" --body "$close_comment"
            gh pr close "$PR_NUMBER" --comment "Closed by base-branch policy (main only from release/*)."
            exit 0
          fi

          # Only dev may promote into next. Everything else belongs on dev.
          if [ "$BASE_REF" = "next" ]; then
            if [ "$HEAD_REF" = "dev" ]; then
              echo "dev → next PR — allowed."
              exit 0
            fi
            reassign_comment=$(printf '%s\n' \
              "↪️ **Base reassigned by base-branch policy**" \
              "" \
              "Only \`dev\` may target \`next\`. This PR was opened against \`next\` from \`$HEAD_REF\`," \
              "so its base has been switched to \`dev\`." \
              "" \
              "See \`.github/BRANCH-AND-RELEASE-POLICY.md\`.")
            gh pr comment "$PR_NUMBER" --body "$reassign_comment"
            gh pr edit "$PR_NUMBER" --base dev
            echo "Reassigned base next → dev on PR #$PR_NUMBER."
            exit 0
          fi

          if [ "$BASE_REF" != "dev" ]; then
            reassign_comment=$(printf '%s\n' \
              "↪️ **Base reassigned by base-branch policy**" \
              "" \
              "Lifecycle work targets \`dev\`. This PR was opened against \`$BASE_REF\`; its base has" \
              "been switched to \`dev\`." \
              "" \
              "See \`.github/BRANCH-AND-RELEASE-POLICY.md\`.")
            gh pr comment "$PR_NUMBER" --body "$reassign_comment"
            gh pr edit "$PR_NUMBER" --base dev
            echo "Reassigned base $BASE_REF → dev on PR #$PR_NUMBER."
            exit 0
          fi

          if is_lifecycle_head "$HEAD_REF" || [ "$HEAD_REF" = "dev" ]; then
            echo "PR #$PR_NUMBER targets dev — allowed."
            exit 0
          fi

          echo "PR #$PR_NUMBER targets dev from a non-lifecycle branch; base is still allowed."
