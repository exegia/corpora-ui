# Stage 3 — When a PR is opened from a lifecycle branch (feature/bug/doc/chore) into dev, convert
# it to draft. Deterministic, no reasoning required, so this is a plain workflow rather than an
# agentic one. (gh-aw exposes no "convert incoming PR to draft" safe-output, and its agent job is
# read-only.)
name: PR Feature → Draft

on:
  pull_request:
    types: [opened, reopened]
    branches: [dev]

permissions:
  pull-requests: write

jobs:
  to-draft:
    # Only lifecycle heads (feature/bug/doc/chore); skip if already a draft.
    if: (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'bug/') || startsWith(github.head_ref, 'doc/') || startsWith(github.head_ref, 'chore/')) && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Convert PR to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so `gh` has no git remote to infer the repo from and
          # every call dies on "fatal: not a git repository". GH_REPO supplies it directly,
          # which is cheaper than checking out a tree the job never reads.
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # Not fatal on failure. `convertPullRequestToDraft` is one of the GraphQL mutations the
        # default GITHUB_TOKEN cannot perform — it returns "Resource not accessible by
        # integration" no matter what `permissions:` says — so this needs a GitHub App or PAT
        # to work at all. Until one is wired up, warn and move on: a check that can never pass
        # is worse than no check, because it teaches everyone to merge past red.
        run: |
          if gh pr ready --undo "$PR_URL"; then
            echo "Converted $PR_URL to draft."
          else
            echo "::warning::Could not convert the PR to draft — GITHUB_TOKEN cannot perform convertPullRequestToDraft. Wire up an App token to enable this."
            {
              echo "### PR not converted to draft"
              echo ""
              echo "\`GITHUB_TOKEN\` cannot perform \`convertPullRequestToDraft\`; this needs a"
              echo "GitHub App or PAT with \`pull-requests: write\`. Mark the PR draft by hand,"
              echo "or wire up an app token to automate it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
