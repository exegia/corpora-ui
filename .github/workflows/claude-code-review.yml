name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    env:
      # The `secrets` context cannot be referenced from an `if:` — GitHub rejects the whole
      # workflow file with "Unrecognized named-value: 'secrets'". Mapping it to a job-level env
      # var makes it reachable from a step-level `if`, which can read `env`. Only emptiness is
      # ever tested; the value is not printed.
      CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The repository has no CLAUDE_CODE_OAUTH_TOKEN configured, so the action was failing
      # on every single PR — a red check that means "unconfigured", not "review found a
      # problem". A permanently-red check is worse than no check: it trains everyone to merge
      # past red. Skip cleanly instead, and say so in the summary so the gap stays visible.
      #
      - name: Note that review is unconfigured
        if: ${{ env.CLAUDE_TOKEN == '' }}
        run: |
          {
            echo "### Claude review skipped"
            echo ""
            echo "\`CLAUDE_CODE_OAUTH_TOKEN\` is not set on this repository, so there is nothing"
            echo "to authenticate with. Add it under **Settings → Secrets and variables →"
            echo "Actions** to turn the review back on."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Claude Code Review
        id: claude-review
        if: ${{ env.CLAUDE_TOKEN != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Allow PRs opened by bot accounts (e.g. anthropic-code-agent[bot],
          # copilot-swe-agent[bot], dependabot[bot]) to pass the action's
          # actor write-access check during OIDC token exchange. Without this,
          # the App token exchange fails with
          # "401 Unauthorized - User does not have write access on this repository".
          allowed_bots: '*'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
